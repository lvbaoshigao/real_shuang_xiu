<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)">
<meta name="description" content="今天你双休了吗？纯静态站点入口，自动跳转到 web/index.html。">
<title>今天你双休了吗？— 入口</title>
<!-- GitHub Pages 入口（docs/SPEC.md §2.1）：只做跳转，不承载业务逻辑、不写死数据。 -->
<meta http-equiv="refresh" content="0; url=web/index.html">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f1e8;
    --surface: #fffdf7;
    --border: #e4ddcc;
    --text: #211c14;
    --text-2: #5b5344;
    --accent: #b13a1e;
    --accent-hover: #8f2d15;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(33, 26, 15, 0.05), 0 6px 18px -6px rgba(33, 26, 15, 0.14);
    --font-display: "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN",
      "STZhongsong", "STSong", "SimSun", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14110d;
      --surface: #1c1813;
      --border: #322c22;
      --text: #f0e9da;
      --text-2: #b3a992;
      --accent: #ff8a5f;
      --accent-hover: #ffa17e;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 12px 32px -16px rgba(0, 0, 0, 0.7);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background-color: var(--bg);
    background-image:
      radial-gradient(900px 380px at 8% -8%, rgba(177, 58, 30, 0.08), transparent 62%),
      radial-gradient(700px 320px at 100% 0%, rgba(31, 42, 66, 0.06), transparent 55%);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.75;
    letter-spacing: 0.01em;
    text-align: center;
  }
  .box {
    width: min(100%, 32rem);
    padding: clamp(1.75rem, 5vw, 2.75rem) clamp(1.25rem, 5vw, 2.25rem);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  h1 {
    margin: 0 0 0.5rem;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 1.5rem;
    line-height: 1.35;
    letter-spacing: 0.02em;
  }
  h1::before {
    content: "";
    display: inline-block;
    width: 0.52em;
    height: 0.52em;
    margin-right: 0.45em;
    border-radius: 2px;
    background: var(--accent);
    transform: translateY(-0.06em);
  }
  p { margin: 0 0 1.5rem; color: var(--text-2); font-size: 0.9375rem; }
  a.enter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0.6rem 1.4rem;
    border-radius: 6px;
    background: var(--accent);
    color: #fffaf4;
    font-weight: 600;
    text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    a.enter { color: #2b1206; }
  }
  a.enter:hover { background: var(--accent-hover); }
  a.enter:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="box">
  <h1>今天你双休了吗？</h1>
  <p>正在进入站点（web/index.html）。如果没有自动跳转，请点击下面的链接。</p>
  <a class="enter" href="web/index.html">点击这里进入</a>
</main>
</body>
</html>
