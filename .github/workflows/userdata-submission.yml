# GitHub Action：把「共享信息」Issue 落盘进 data/userdata_company.json / data/userdata_school.json
# 契约：tools/ingest-userdata.mjs 文件头（marker + fenced JSON 记录键，与 web/app.js 三方共用）。
#
# 触发：issues 的 opened 与 labeled 两个事件（与 comment-submission.yml 同款守卫）。
#   · opened  保证「不依赖 label 是否存在」——前端用
#     https://github.com/<site.repo>/issues/new?...&labels=userdata-submission 创建 Issue，
#     即使仓库里还没建 userdata-submission 标签，正文的固定标记也能让提交被处理，不会静默失败；
#   · labeled 兼容「先建 Issue、后打标签」的用法。
# 守卫（job 级 if）：正文含 <!-- userdata-submission --> 或带 userdata-submission 标签才处理。
# 权限：contents: write（提交数据变更）、issues: write（评论 / 关闭 / 打 invalid 标签）。
#
# 启用前必做：① 仓库 Settings → Labels 建标签 userdata-submission（推荐，便于 labeled 入口）；
#            ② 把 data/index.json 的 site.repo 改成自己的 OWNER/REPO。
name: Userdata submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: userdata-submission-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ingest:
    name: 解析并落盘共享信息
    # 守卫 = 「正文含固定标记 或 带 userdata-submission 标签」；
    # 末尾的 !(...) 是防重复子句：Issue 创建时即打标会同时触发 opened 与 labeled 两个事件，
    # 只要正文带标记就固定由 opened 处理，labeled 事件不再重复落盘（concurrency 只防并发，不防重复）。
    if: ${{ (contains(github.event.issue.body || '', '<!-- userdata-submission -->') || contains(github.event.issue.labels.*.name, 'userdata-submission')) && !(github.event.action == 'labeled' && contains(github.event.issue.body || '', '<!-- userdata-submission -->')) }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析 Issue 并追加共享信息
        id: ingest
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.txt"
          node tools/ingest-userdata.mjs --body-file "$RUNNER_TEMP/issue-body.txt" 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: 提交数据变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/userdata_company.json data/userdata_school.json
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore(userdata): 落盘 Issue #${{ github.event.issue.number }} 的共享信息（${{ steps.ingest.outputs.board }}：${{ steps.ingest.outputs.target }}）"
            git push
          fi

      - name: 评论并关闭 Issue（成功）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "✅ 共享信息已写入 ${{ steps.ingest.outputs.file }}"
            echo ""
            echo "- 板块：${{ steps.ingest.outputs.board }}"
            echo "- 目标：${{ steps.ingest.outputs.target }}"
            echo "- 记录数：${{ steps.ingest.outputs.records }}"
            echo ""
            echo "站点将在 Pages 部署完成后展示该条目（打开「共享信息」开关可见，带「共享」徽标）。感谢共享，本 Issue 自动关闭。"
          } > "$RUNNER_TEMP/success.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/success.md"
          gh issue close "$ISSUE_NUMBER"

      - name: 反馈失败原因并打 invalid 标签
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "❌ 共享信息未能写入 data/userdata_*.json，原因如下："
            echo ""
            echo '```'
            if [ -f "$RUNNER_TEMP/ingest.log" ]; then tail -n 40 "$RUNNER_TEMP/ingest.log"; else echo "（没有日志）"; fi
            echo '```'
            echo ""
            echo "提交体需包含首行 <!-- userdata-submission --> 标记与 \`\`\`json 围栏记录（键：板块 / 目标 / 岗位 / 双休情况 / 说明 / 昵称 / 日期）。"
          } > "$RUNNER_TEMP/failure.md"
          gh label create invalid --color B60205 || true
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/failure.md"
          gh issue edit "$ISSUE_NUMBER" --add-label invalid || true
